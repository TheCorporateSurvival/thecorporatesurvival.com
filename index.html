    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #0a1628;
            --navy-deep: #050d1a;
            --gold: #c9a84c;
            --gold-light: #e8c55a;
            --gold-dim: rgba(201, 168, 76, 0.3);
            --white: #f1f5f9;
            --white-dim: #8899aa;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        html {
            height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--navy);
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(201, 168, 76, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(201, 168, 76, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 22, 40, 1) 0%, var(--navy-deep) 100%);
            position: relative;
        }

        /* Logo icon */
        .logo-mark {
            width: 180px;
            height: auto;
            margin-top: 3rem;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 30px rgba(201, 168, 76, 0.2));
            animation: float 6s ease-in-out infinite;
        }

        /* Brand name in Cinzel — small caps (капитель) */
        .brand-name {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5.5vw, 3rem);
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--gold);
            line-height: 1;
            margin-bottom: -0.1rem;
            font-variant: small-caps;
        }

        .brand-sub {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5.5vw, 3rem);
            font-weight: 600;
            letter-spacing: 0.06em;
            color: var(--gold);
            line-height: 1;
            margin-bottom: 1.8rem;
            font-variant: small-caps;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Tagline */
        .tagline {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--white-dim);
            font-weight: 300;
            letter-spacing: 0.04em;
            margin-bottom: 2.5rem;
            max-width: 480px;
            line-height: 1.7;
        }

        .tagline em {
            font-style: normal;
            color: var(--gold);
            font-weight: 500;
        }

        /* Coming Soon */
        .coming-soon {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--gold), var(--gold-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 0.8rem 2.5rem;
            border: 1px solid var(--gold-dim);
            border-radius: 100px;
            margin-bottom: 2.5rem;
            font-weight: 700;
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.08), inset 0 0 20px rgba(201, 168, 76, 0.03);
            animation: glow 4s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(201, 168, 76, 0.08), inset 0 0 20px rgba(201, 168, 76, 0.03); }
            50% { box-shadow: 0 0 30px rgba(201, 168, 76, 0.15), inset 0 0 30px rgba(201, 168, 76, 0.05); }
        }

        /* YouTube button */
        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.9rem 2.2rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.12), rgba(200, 0, 0, 0.08));
            color: #ff4444;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: all 0.3s;
            margin-bottom: 2.5rem;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.06);
        }

        .yt-link:hover {
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.22), rgba(200, 0, 0, 0.15));
            border-color: rgba(255, 0, 0, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(255, 0, 0, 0.2);
            color: #ff6666;
        }

        .yt-link svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
            filter: drop-shadow(0 0 4px rgba(255, 0, 0, 0.3));
        }

        /* Contact Form */
        .contact-section {
            width: 100%;
            max-width: 420px;
            margin-bottom: 3rem;
        }

        /* Contact toggle button */
        .contact-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.8rem;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--white-dim);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 0.8rem;
        }

        .contact-toggle:hover {
            border-color: var(--gold-dim);
            color: var(--gold);
            background: rgba(201, 168, 76, 0.08);
        }

        .contact-toggle svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .contact-toggle .arrow {
            font-size: 0.7rem;
            transition: transform 0.3s;
        }

        .contact-toggle.open .arrow {
            transform: rotate(180deg);
        }

        /* Collapsible form wrapper */
        .contact-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease, opacity 0.4s ease;
            opacity: 0;
            width: 100%;
        }

        .contact-body.open {
            max-height: 500px;
            opacity: 1;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            padding-top: 1rem;
        }

        .form-row {
            display: flex;
            gap: 0.8rem;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .contact-form input::placeholder,
        .contact-form textarea::placeholder {
            color: rgba(136, 153, 170, 0.5);
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: var(--gold-dim);
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.08);
        }

        .contact-form textarea {
            resize: vertical;
            min-height: 80px;
            max-height: 200px;
        }

        /* Honeypot — hidden from humans, traps bots */
        .hp-field {
            position: absolute;
            left: -9999px;
            opacity: 0;
            height: 0;
            width: 0;
            overflow: hidden;
        }

        /* reCAPTCHA container */
        .recaptcha-wrap {
            display: flex;
            justify-content: center;
            margin: 0.3rem 0;
        }

        .contact-form button {
            padding: 0.75rem 2rem;
            border-radius: 10px;
            border: 1px solid var(--gold-dim);
            background: rgba(201, 168, 76, 0.1);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .contact-form button:hover {
            background: rgba(201, 168, 76, 0.2);
            border-color: var(--gold);
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.15);
            transform: translateY(-1px);
        }

        /* Success message */
        .form-success {
            display: none;
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.08);
            color: #6ee7b7;
            font-size: 0.9rem;
        }

        /* Footer */
        .footer {
            margin-top: auto;
            padding-top: 2rem;
            padding-bottom: 1.5rem;
            font-size: 0.72rem;
            color: rgba(136, 153, 170, 0.5);
            letter-spacing: 0.05em;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .logo-mark { width: 150px; }
            .yt-link { font-size: 0.95rem; padding: 0.8rem 1.8rem; }
            .recaptcha-wrap { transform: scale(0.9); transform-origin: center; }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body { padding: 1.2rem; }
            .logo-mark { width: 110px; margin-top: 1.5rem; margin-bottom: 0.8rem; }
            .brand-name, .brand-sub { font-size: 1.3rem; }
            .tagline { margin-bottom: 1.8rem; font-size: 0.9rem; }
            .coming-soon { margin-bottom: 1.8rem; font-size: 1rem; padding: 0.6rem 1.8rem; letter-spacing: 0.2em; }
            .yt-link { font-size: 0.85rem; padding: 0.7rem 1.4rem; gap: 0.5rem; }
            .yt-link svg { width: 20px; height: 20px; }
            .form-row { flex-direction: column; }
            .contact-section { max-width: 100%; }
            .contact-form input, .contact-form textarea { font-size: 16px; }
            .recaptcha-wrap { transform: scale(0.82); transform-origin: center; }
            .contact-body.open { max-height: 600px; }
        }

        /* Small mobile */
        @media (max-width: 360px) {
            .logo-mark { width: 90px; }
            .brand-name, .brand-sub { font-size: 1.1rem; }
            .coming-soon { font-size: 0.9rem; }
            .recaptcha-wrap { transform: scale(0.72); transform-origin: center; }
        }
    </style>
</head>

<!-- Logo -->
<img class="logo-mark" src="logo.png" alt="The Corporate Survival">
<div class="brand-name">Corporate</div>
<div class="brand-sub">Survival</div>

    <em>Navigate. Survive. Thrive.</em><br>
    AI-powered storytelling about corporate life.<br>
    From your first day to the boardroom.
</p>

<div class="coming-soon">Coming Soon</div>

<a href="https://www.youtube.com/@TheCorporateSurvival" target="_blank" rel="noopener" class="yt-link">
    <svg viewBox="0 0 24 24"><path d="M23.5 6.2c-.3-1-1-1.8-2-2.1C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.5.6c-1 .3-1.7 1.1-2 2.1C0 8.1 0 12 0 12s0 3.9.5 5.8c.3 1 1 1.8 2 2.1 1.9.6 9.5.6 9.5.6s7.6 0 9.5-.6c1-.3 1.7-1.1 2-2.1.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
    @TheCorporateSurvival
</a>

<!-- Contact Form -->
<div class="contact-section">
    <button class="contact-toggle" id="contact-toggle" onclick="toggleForm()">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
        Contact Us
        <span class="arrow">&#9660;</span>
    </button>
    <div class="contact-body" id="contact-body">
    <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <!-- Web3Forms Access Key -->
        <input type="hidden" name="access_key" value="53ed1862-29a5-4340-b91a-203cf1f2b105">
        <input type="hidden" name="subject" content="New message from thecorporatesurvival.com">
        <input type="hidden" name="from_name" content="The Corporate Survival">

        <div class="form-row">
            <input type="text" name="name" placeholder="Name" required minlength="2">
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <textarea name="message" placeholder="Your message (at least 20 characters)..." rows="3" required minlength="20"></textarea>

        <!-- Honeypot field — invisible to humans, catches bots (Web3Forms also supports this) -->
        <div class="hp-field" aria-hidden="true">
            <input type="text" name="botcheck" tabindex="-1" autocomplete="off">
        </div>

        <!-- hCaptcha — Web3Forms built-in, no separate account needed -->
        <div class="recaptcha-wrap">
            <div class="h-captcha" data-captcha="true"></div>
        </div>

        <button type="submit">Send Message</button>
    </form>
    <div class="form-success" id="form-success">Thank you! Your message has been sent.<br>We'll get back to you soon.</div>
    </div>
</div>

<div class="footer">&copy; 2026 The Corporate Survival</div>

<script>
// Toggle contact form
function toggleForm() {
    var body = document.getElementById('contact-body');
    var btn = document.getElementById('contact-toggle');
    body.classList.toggle('open');
    btn.classList.toggle('open');
    if (body.classList.contains('open')) {
        gtag('event', 'contact_form_open', { event_category: 'engagement' });
    }
}

// Form submission via Web3Forms with AJAX
var form = document.getElementById('contact-form');
var success = document.getElementById('form-success');

form.addEventListener('submit', function(e) {
    e.preventDefault();

    var data = new FormData(form);

    fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
    }).then(function(res) {
        return res.json();
    }).then(function(json) {
        if (json.success) {
            form.style.display = 'none';
            success.style.display = 'block';
            form.reset();
            gtag('event', 'contact_form_submit', { event_category: 'engagement' });
        } else {
            alert('Something went wrong. Please try again.');
        }
    }).catch(function() {
        alert('Connection error. Please try again.');
    });
});
</script>
