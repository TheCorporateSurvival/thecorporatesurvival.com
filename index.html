<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Corporate Survival — Coming Soon</title>
    <meta name="description" content="Navigate. Survive. Thrive. — AI-powered storytelling about corporate life. Coming soon.">
    <meta property="og:title" content="The Corporate Survival — Coming Soon">
    <meta property="og:description" content="Navigate. Survive. Thrive. — AI-powered media network launching soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://thecorporatesurvival.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #0a1628;
            --navy-deep: #050d1a;
            --gold: #c9a84c;
            --gold-light: #e8c55a;
            --gold-dim: rgba(201, 168, 76, 0.3);
            --white: #f1f5f9;
            --white-dim: #8899aa;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        html, body {
            height: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--navy);
            color: var(--white);
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(201, 168, 76, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(201, 168, 76, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(10, 22, 40, 1) 0%, var(--navy-deep) 100%);
            position: relative;
        }

        /* Subtle animated border glow */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            border: 1px solid var(--glass-border);
            margin: 1.5rem;
            border-radius: 24px;
            pointer-events: none;
        }

        /* Logo image */
        .logo-mark {
            width: 220px;
            height: auto;
            margin-bottom: 2.5rem;
            filter: drop-shadow(0 0 30px rgba(201, 168, 76, 0.2));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Tagline */
        .tagline {
            font-size: clamp(0.95rem, 2vw, 1.15rem);
            color: var(--white-dim);
            font-weight: 300;
            letter-spacing: 0.04em;
            margin-bottom: 3.5rem;
            max-width: 480px;
            line-height: 1.7;
        }

        .tagline em {
            font-style: normal;
            color: var(--gold);
            font-weight: 500;
        }

        /* Coming Soon */
        .coming-soon {
            font-size: 0.75rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--white-dim);
            padding: 0.6rem 2rem;
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            background: var(--glass);
            margin-bottom: 3rem;
            font-weight: 500;
        }

        /* Social links */
        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .social-links a {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white-dim);
            text-decoration: none;
            transition: all 0.3s;
        }

        .social-links a:hover {
            border-color: var(--gold-dim);
            color: var(--gold);
            background: rgba(201, 168, 76, 0.08);
            transform: translateY(-2px);
        }

        .social-links a svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 2.5rem;
            font-size: 0.72rem;
            color: rgba(136, 153, 170, 0.5);
            letter-spacing: 0.05em;
        }

        .footer a {
            color: rgba(136, 153, 170, 0.5);
            text-decoration: none;
            transition: color 0.3s;
        }
        .footer a:hover {
            color: var(--gold-dim);
        }

        /* Mobile */
        @media (max-width: 480px) {
            body { padding: 1.5rem; }
            body::before { margin: 0.8rem; border-radius: 16px; }
            .logo-mark { width: 160px; margin-bottom: 1.5rem; }
            .tagline { margin-bottom: 2.5rem; }
            .coming-soon { margin-bottom: 2rem; }
        }
    </style>
</head>
<body>

<!-- Logo -->
<img class="logo-mark" src="logo.png" alt="The Corporate Survival">

<p class="tagline">
    <em>Navigate. Survive. Thrive.</em><br>
    AI-powered storytelling about corporate life.<br>
    From your first day to the boardroom.
</p>

<div class="coming-soon">Coming Soon</div>

<div class="social-links">
    <!-- YouTube -->
    <a href="https://www.youtube.com/@TheCorporateSurvival" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24"><path d="M23.5 6.2c-.3-1-1-1.8-2-2.1C19.6 3.5 12 3.5 12 3.5s-7.6 0-9.5.6c-1 .3-1.7 1.1-2 2.1C0 8.1 0 12 0 12s0 3.9.5 5.8c.3 1 1 1.8 2 2.1 1.9.6 9.5.6 9.5.6s7.6 0 9.5-.6c1-.3 1.7-1.1 2-2.1.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.5 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg>
    </a>
    <!-- Email (JS-protected) -->
    <a href="#" id="email-btn" aria-label="Email">
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
    </a>
</div>

<div class="footer">&copy; 2026 The Corporate Survival &middot; <a href="#" id="email-footer">contact us</a></div>

<script>
// Email obfuscation — bots can't read this
(function(){
    var p = ['thecorporate','survival','@','gm','ail','.com'];
    var e = p[0]+p[1]+p[2]+p[3]+p[4]+p[5];
    var btn = document.getElementById('email-btn');
    var ftr = document.getElementById('email-footer');
    btn.addEventListener('click', function(ev){

    });
    ftr.addEventListener('click', function(ev){
        ev.preventDefault();
        window.location.href = 'mai'+'lto:'+e;
    });
})();
</script>

</body>
</html>
